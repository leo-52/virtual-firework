<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrevoFX — banc d'aperçu effets</title>
  <style>html,body{margin:0;height:100%;background:#0a0a12;overflow:hidden}canvas{display:block}
    #lbl{position:fixed;left:14px;top:12px;color:#ffd27a;font:600 16px system-ui;text-shadow:0 1px 3px #000}</style>
  <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="lbl"></div>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    // import DYNAMIQUE horodaté -> on charge toujours le dernier moteur (sinon ?preview reste en cache)
    const { __scene, __Shell, __updateTrails, __updatePuffs } =
      await import('./src/render/threeFireworks.js?preview=' + Date.now());

    const W = innerWidth || 1280, H = innerHeight || 800;   // fallback si la fenêtre preview est à 0×0 (headless) -> le canvas rend quand même
    const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
    renderer.setSize(W, H); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.3;
    renderer.setClearColor(0x000000, 1);   // NOIR pur (comme le ciel nocturne de l'app) -> les mesures de halo/brouillard ne sont plus polluées par le fond
    document.body.appendChild(renderer.domElement);

    // Cadrage "showcase" : vue public (au sol, dans l'axe) mais ZOOMÉE (téléobjectif) pour
    // remplir le cadre avec le burst. window.__cam permet d'ajuster en direct.
    const camera = new THREE.PerspectiveCamera(34, W/H, 1, 50000);
    camera.position.set(0, 1.75, 150); camera.lookAt(0, 80, 0);
    window.__camera = camera;
    window.__cam = (fov, lookY, dist) => { camera.fov=fov; camera.position.set(0,1.75,dist);
      camera.lookAt(0,lookY,0); camera.updateProjectionMatrix(); };

    window.__scene = __scene;   // pour inspection (compter les grains de traînée, etc.)
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(__scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.3, 0.22, 0.55));   // aligné sur l'app (B106 anti-brouillard)
    composer.addPass(new OutputPass());

    let shell = null;
    const step = () => { if (shell) shell.update(1/60); __updateTrails(1/60); __updatePuffs(1/60); };
    const settle = n => { for (let i=0;i<n;i++) step(); };   // laisse mourir le tir précédent + vide les pools

    // Joue un effet 75mm jusqu'au burst, +burstFrames frames, puis rend UNE image (statique = screenshot OK).
    // rgb (optionnel) = [r,g,b] 0..1 -> override de couleur (ex "crackling aqua", "mosaïque rouge").
    window.__show = (arch, burstFrames, label, rgb, cal) => {
      settle(280);
      const opts = rgb ? { color: new THREE.Color(rgb[0], rgb[1], rgb[2]) } : undefined;
      shell = new __Shell(arch, 0, 0, cal, opts);   // cal absent -> calibre par défaut de l'EFFET (cfg.cal, ex cœur=100mm) sinon 75
      window.__lastShell = shell;
      let g = 0; while (shell.phase !== 'burst' && g++ < 500) step();
      for (let i=0;i<burstFrames;i++) step();
      document.getElementById('lbl').textContent = label || arch;
      composer.render();
      return { arch, phase: shell.phase, nAlive: shell.nAlive };
    };
    // __step(n) : avance le MÊME tir de n frames puis rend (suivi temporel d'un seul tir, sans re-tirer)
    window.__step = (n) => { for (let i=0;i<n;i++) step(); composer.render(); return shell ? {phase:shell.phase} : null; };
    window.__ready = true;
  </script>
</body>
</html>
