<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate"><!-- re-valider index.html à chaque visite (anti-cache) -->
  <title>PrevoFX — aperçu web</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#000; }
    #hud {
      position:absolute; top:10px; left:10px; z-index:10;
      color:#fff; font-family: system-ui, sans-serif; font-size:13px;
      background:rgba(0,0,0,.45); padding:8px 12px; border-radius:6px; line-height:1.4;
    }
    #hud b { color:#ffd27a; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="hud"><b>PrevoFX — aperçu web</b><br>pivoine 75 (démo) · clavier QZSD + clic-glisser</div>
  <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script type="module">
    // CACHE-BUST : le navigateur met en cache les MODULES JS par leur URL ; le ?v= sur la
    // page ne rafraîchit PAS main.js/threeFireworks.js -> on voyait l'ANCIEN code après un
    // déploiement. On ajoute un horodatage à l'import racine ; main.js le propage à ses enfants.
    import('./src/main.js?v=' + Date.now());
  </script>
</body>
</html>
