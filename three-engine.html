<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrevoFX — Moteur Three.js (pivoine + traînées)</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #04040a; }
        canvas { display: block; }
    </style>
</head>
<body>

<script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    } }
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============================================================================
// MOTEUR DE FEUX — synthèse : rendu additif "TruePeony" + TRAÎNÉES (micro-grains
// qui meurent un par un, durées variées). 100% procédural, aucune image externe.
// ============================================================================

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04040a, 0.0012);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 48, 140);
camera.lookAt(0, 62, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; // rendu "vidéo/ciné"
renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);

// BLOOM CINÉMATIQUE (le vrai saut "AAA") : EffectComposer = rendu scène -> UnrealBloomPass
// (la lumière des points vifs "bave" en halo doux) -> OutputPass (tonemapping ACES + sRGB).
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight),
  0.9,   // strength  : intensité du halo
  0.5,   // radius    : étalement du halo
  0.0);  // threshold : 0 -> tout ce qui est lumineux rayonne (fond noir)
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// --- TEXTURE ÉTOILE : cœur blanc incandescent -> halo couleur -> transparent ---
function makeStarTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32,32,0, 32,32,32);
  g.addColorStop(0.0,  'rgba(255,255,255,1)');
  g.addColorStop(0.18, 'rgba(255,200,120,0.95)');
  g.addColorStop(0.45, 'rgba(255,120,30,0.5)');
  g.addColorStop(1.0,  'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0,0,64,64);
  const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
}
const starTex = makeStarTexture();

// --- TEXTURE FUMÉE : bouffée très douce et translucide (pas d'image externe) ---
function makeSmokeTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,0, 64,64,64);
  g.addColorStop(0.0, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.45,'rgba(255,255,255,0.16)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
}
const smokeTex = makeSmokeTexture();

// ============================================================================
// POOL DE TRAÎNÉES (partagé) — un seul nuage de points additif, recyclé en anneau.
// Chaque grain : durée de vie en loi de puissance -> ils s'éteignent un par un.
// ============================================================================
const TRAIL_MAX = 12000;
const trailPos  = new Float32Array(TRAIL_MAX * 3);
const trailCol  = new Float32Array(TRAIL_MAX * 3);
const trailSize = new Float32Array(TRAIL_MAX);
const trail = []; // données CPU
for (let i = 0; i < TRAIL_MAX; i++){
  trail.push({ x:0,y:0,z:0, vx:0,vy:0,vz:0, age:0, life:0, size:0, r:0,g:0,b:0, alive:false });
  trailSize[i] = 0;
}
let trailHead = 0;
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
trailGeo.setAttribute('color',    new THREE.BufferAttribute(trailCol, 3));
trailGeo.setAttribute('size',     new THREE.BufferAttribute(trailSize, 1));
const trailMat = new THREE.PointsMaterial({
  size: 1.0, map: starTex, vertexColors: true, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
scene.add(new THREE.Points(trailGeo, trailMat));

function spawnTrail(x,y,z, r,g,b, size){
  const i = trailHead; trailHead = (trailHead + 1) % TRAIL_MAX;
  const t = trail[i];
  t.x=x; t.y=y; t.z=z;
  // léger éparpillement + chute douce (les grains ne suivent pas pile l'étoile)
  t.vx = (Math.random()-0.5)*0.8;
  t.vy = -Math.random()*0.6;
  t.vz = (Math.random()-0.5)*0.8;
  t.age = 0;
  // loi de puissance, MAIS courtes -> petite queue (pivoine), pas de longs filaments (saule)
  t.life = 0.14 + 0.30 * Math.pow(Math.random(), 1.8);
  t.size = size * (0.7 + Math.random()*0.6);
  t.r=r; t.g=g; t.b=b; t.alive = true;
}

function updateTrails(dt){
  for (let i = 0; i < TRAIL_MAX; i++){
    const t = trail[i];
    if (!t.alive){ trailSize[i] = 0; continue; }
    t.age += dt;
    if (t.age >= t.life){ t.alive = false; trailSize[i] = 0; continue; }
    t.vy += -2.5 * dt;          // gravité douce
    t.vx *= 0.96; t.vy *= 0.98; t.vz *= 0.96;
    t.x += t.vx*dt; t.y += t.vy*dt; t.z += t.vz*dt;
    const k = 1 - t.age / t.life;   // s'éteint en douceur
    trailPos[i*3] = t.x; trailPos[i*3+1] = t.y; trailPos[i*3+2] = t.z;
    trailCol[i*3] = t.r*k; trailCol[i*3+1] = t.g*k; trailCol[i*3+2] = t.b*k;
    trailSize[i] = t.size * (0.4 + 0.6*k);
  }
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.color.needsUpdate = true;
  trailGeo.attributes.size.needsUpdate = true;
}

// ============================================================================
// PIVOINE — coquille creuse homogène (TruePeony), orange stable, + traînées.
// ============================================================================
const PEONY = {
  stars: 80,                 // une VRAIE pivoine ~80 étoiles distinctes (pas une purée)
  speed: 42,                 // vitesse d'éjection (coquille)
  drag: 0.955,               // frein (coquille nette et brillante)
  gravity: -9.81,
  color: new THREE.Color(1.0, 0.22, 0.015), // (base ; la COMBUSTION fait évoluer la teinte)
  starSize: 6.0,             // chaque étoile = un point de feu bien visible
  lifeMin: 1.5, lifeMax: 2.1,
  trail: false               // PIVOINE = pas de traînée (les traînées = saule/comète/autres effets)
};

class Peony {
  constructor(apex){
    this.apex = apex; this.dead = false;
    const n = PEONY.stars;
    this.pos = new Float32Array(n*3);
    this.col = new Float32Array(n*3);
    this.siz = new Float32Array(n);
    this.data = [];
    for (let i = 0; i < n; i++){
      this.pos[i*3]=apex.x; this.pos[i*3+1]=apex.y; this.pos[i*3+2]=apex.z;
      // direction sphérique uniforme
      const u=Math.random(), v=Math.random();
      const th=u*2*Math.PI, ph=Math.acos(2*v-1);
      const dx=Math.sin(ph)*Math.cos(th), dy=Math.sin(ph)*Math.sin(th), dz=Math.cos(ph);
      const sp = PEONY.speed * (0.96 + Math.random()*0.08);
      this.col[i*3]=PEONY.color.r; this.col[i*3+1]=PEONY.color.g; this.col[i*3+2]=PEONY.color.b;
      this.siz[i]=PEONY.starSize;
      this.data.push({
        vx:dx*sp, vy:dy*sp, vz:dz*sp, age:0,
        life: PEONY.lifeMin + Math.random()*(PEONY.lifeMax-PEONY.lifeMin),
        dimVar: 0.82 + Math.random()*0.30,   // variation d'éclat par étoile (nuée organique)
        lastX:apex.x, lastY:apex.y, lastZ:apex.z, since:0
      });
    }
    this.geo = new THREE.BufferGeometry();
    this.geo.setAttribute('position', new THREE.BufferAttribute(this.pos,3));
    this.geo.setAttribute('color',    new THREE.BufferAttribute(this.col,3));
    this.geo.setAttribute('size',     new THREE.BufferAttribute(this.siz,1));
    this.mat = new THREE.PointsMaterial({
      size:4.0, map:starTex, vertexColors:true, transparent:true,   // taille RÉELLE des étoiles (l'attribut par-point est ignoré par PointsMaterial)
      blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
    });
    this.points = new THREE.Points(this.geo, this.mat);
    scene.add(this.points);

    // FLASH CENTRAL (idée de la version "Skylighter") : la charge d'éclatement qui
    // détone à l'ouverture -> boule de feu blanche, expansion brutale, disparaît en ~0,13 s.
    this.age = 0;
    const fg = new THREE.SphereGeometry(0.7, 16, 16);              // plus petit
    const fm = new THREE.MeshBasicMaterial({ color: 0xffc888, transparent: true, // ambré, pas blanc pur
      blending: THREE.AdditiveBlending, depthWrite: false });
    this.flash = new THREE.Mesh(fg, fm);
    this.flash.position.copy(apex);
    scene.add(this.flash);

    // MOTION-BLUR ("tube" dû à la vitesse, vu caméra) : un court segment derrière chaque
    // tête. PAS une traînée de poudre -> l'étoile-boule étirée par sa vitesse, qui
    // redevient ronde quand elle ralentit. (Idée des variantes "lignes directionnelles".)
    this.lpos = new Float32Array(n*2*3);
    this.lcol = new Float32Array(n*2*3);
    this.lgeo = new THREE.BufferGeometry();
    this.lgeo.setAttribute('position', new THREE.BufferAttribute(this.lpos,3));
    this.lgeo.setAttribute('color',    new THREE.BufferAttribute(this.lcol,3));
    this.lmat = new THREE.LineBasicMaterial({ vertexColors:true, transparent:true,
      blending:THREE.AdditiveBlending, depthWrite:false });
    this.lines = new THREE.LineSegments(this.lgeo, this.lmat);
    scene.add(this.lines);

    // FUMÉE rétroéclairée : quelques bouffées molles, éclairées chaud par le break,
    // qui dérivent, grossissent et se dissipent (ambiance des vraies photos).
    const sN = 24; this.smN = sN;
    this.smPos = new Float32Array(sN*3);
    this.smCol = new Float32Array(sN*3);
    this.smData = [];
    for (let i=0;i<sN;i++){
      this.smPos[i*3]   = apex.x + (Math.random()-0.5)*8;
      this.smPos[i*3+1] = apex.y + (Math.random()-0.5)*8;
      this.smPos[i*3+2] = apex.z + (Math.random()-0.5)*8;
      this.smData.push({ vx:(Math.random()-0.5)*7, vy:(Math.random()-0.5)*5+2.5,
                         vz:(Math.random()-0.5)*7, seed:0.7+Math.random()*0.6 });
    }
    this.smGeo = new THREE.BufferGeometry();
    this.smGeo.setAttribute('position', new THREE.BufferAttribute(this.smPos,3));
    this.smGeo.setAttribute('color',    new THREE.BufferAttribute(this.smCol,3));
    this.smMat = new THREE.PointsMaterial({ size:30, map:smokeTex, vertexColors:true,
      transparent:true, opacity:0.0, blending:THREE.NormalBlending, depthWrite:false, sizeAttenuation:true });
    this.smoke = new THREE.Points(this.smGeo, this.smMat);
    this.smoke.renderOrder = -1; // derrière les étoiles
    scene.add(this.smoke);
  }

  update(dt){
    if (this.dead) return;
    this.age += dt;
    // flash d'ouverture (très bref)
    if (this.flash){
      const fd = 0.09;                          // plus bref
      if (this.age < fd){
        const p = this.age / fd;
        this.flash.scale.setScalar(1 + p*6);    // expansion bien plus petite
        this.flash.material.opacity = (1 - p) * 0.55; // moins aveuglant
      } else {
        scene.remove(this.flash); this.flash.geometry.dispose();
        this.flash.material.dispose(); this.flash = null;
      }
    }
    const n = PEONY.stars; let alive = 0;
    for (let i = 0; i < n; i++){
      const d = this.data[i];
      const li = i*6;
      if (d.age >= d.life){ this.siz[i]=0; this.col[i*3]=this.col[i*3+1]=this.col[i*3+2]=0;
        this.lcol[li]=this.lcol[li+1]=this.lcol[li+2]=this.lcol[li+3]=this.lcol[li+4]=this.lcol[li+5]=0; continue; } // éteinte = invisible
      alive++; d.age += dt;
      const pr = d.age / d.life;
      d.vy += PEONY.gravity*dt;
      d.vx *= PEONY.drag; d.vy *= PEONY.drag; d.vz *= PEONY.drag;
      const px = this.pos[i*3]+d.vx*dt, py = this.pos[i*3+1]+d.vy*dt, pz = this.pos[i*3+2]+d.vz*dt;
      this.pos[i*3]=px; this.pos[i*3+1]=py; this.pos[i*3+2]=pz;

      // COMBUSTION RÉALISTE (la braise refroidit) : orange vif/brillant l'essentiel de la
      // vie, pointe blanc-chaud à l'allumage, puis ROUGE en toute fin. C'est ÇA le "vrai feu".
      let r=1.0, g, b;
      if (pr < 0.6){ g = 0.28 - 0.06*(pr/0.6); b = 0.03; }              // orange franc (0.28->0.22)
      else { const t=(pr-0.6)/0.4; g = 0.22 - 0.17*t; b = 0.03*(1-t); } // refroidit vers le rouge (0.22->0.05)
      if (pr < 0.05){ const f=(1-pr/0.05)*0.55; r=r+(1-r)*f; g=g+(1-g)*f; b=b+(1-b)*f; } // pointe blanc-chaud
      // intensité : pic chaud à l'allumage (bloom -> blanc), burn brillant, fondu final
      let inten = (pr < 0.10) ? (3.2 - (pr/0.10)*0.8) : 2.4;   // 3.2 -> 2.4 (bien brillant)
      inten *= d.dimVar;                                        // variation organique par étoile
      if (pr > 0.80){ const k=(1-pr)/0.20; inten *= k; this.siz[i]=PEONY.starSize*k; } // fondu final
      this.col[i*3]=r*inten; this.col[i*3+1]=g*inten; this.col[i*3+2]=b*inten;

      // MOTION-BLUR : segment tête->arrière, longueur ∝ vitesse (court), queue sombre -> fuseau.
      const mbk = 0.09;
      this.lpos[li]=px;          this.lpos[li+1]=py;          this.lpos[li+2]=pz;
      this.lpos[li+3]=px-d.vx*mbk; this.lpos[li+4]=py-d.vy*mbk; this.lpos[li+5]=pz-d.vz*mbk;
      const hr=r*inten, hg=g*inten, hb=b*inten;
      this.lcol[li]=hr;      this.lcol[li+1]=hg;      this.lcol[li+2]=hb;        // tête = couleur étoile
      this.lcol[li+3]=hr*0.12; this.lcol[li+4]=hg*0.12; this.lcol[li+5]=hb*0.12; // queue sombre

      // TRAÎNÉE : micro-grains lâchés le long du trajet (tant que l'étoile est "vive")
      d.since += dt;
      if (PEONY.trail && pr < 0.28 && d.since > 0.032){   // (désactivé pour la pivoine)
        const mx=(d.lastX+px)*0.5, my=(d.lastY+py)*0.5, mz=(d.lastZ+pz)*0.5;
        // couleur de traînée ASSOMBRIE (0.5) -> pas d'accumulation additif dorée
        spawnTrail(mx,my,mz, PEONY.color.r*0.5, PEONY.color.g*0.5, PEONY.color.b*0.5, 1.0);
        d.lastX=px; d.lastY=py; d.lastZ=pz; d.since=0;
      }
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.color.needsUpdate = true;
    this.geo.attributes.size.needsUpdate = true;
    this.lgeo.attributes.position.needsUpdate = true;
    this.lgeo.attributes.color.needsUpdate = true;

    // FUMÉE : dérive + grossit + éclairée chaud au début (backlit) puis s'assombrit/dissipe
    const sp = Math.min(1, this.age/2.4);
    const ramp = Math.min(1, this.age/0.15);
    this.smMat.size = 30 * (1 + sp*1.6);
    this.smMat.opacity = 0.40 * ramp * (1-sp) * (1-sp);
    const il = Math.max(0, 1 - sp*1.25);          // illumination (chaud) décroît
    for (let i=0;i<this.smN;i++){
      const sd = this.smData[i];
      this.smPos[i*3]   += sd.vx*dt;
      this.smPos[i*3+1] += sd.vy*dt;
      this.smPos[i*3+2] += sd.vz*dt;
      const warm = 0.5*il*sd.seed;
      this.smCol[i*3]   = 0.10 + warm;            // chaud quand éclairée -> gris quand éteint
      this.smCol[i*3+1] = 0.09 + warm*0.5;
      this.smCol[i*3+2] = 0.10 + warm*0.15;
    }
    this.smGeo.attributes.position.needsUpdate = true;
    this.smGeo.attributes.color.needsUpdate = true;

    if (alive === 0){
      this.dead = true; scene.remove(this.points); scene.remove(this.lines); scene.remove(this.smoke);
      this.geo.dispose(); this.mat.dispose(); this.lgeo.dispose(); this.lmat.dispose();
      this.smGeo.dispose(); this.smMat.dispose();
    }
  }
}

// ============================================================================
// BOUCLE
// ============================================================================
let peony = null;
let rafId = 0;
const clock = new THREE.Clock();
function animate(){
  rafId = requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!peony || peony.dead) peony = new Peony(new THREE.Vector3(0, 62, 0));
  peony.update(dt);
  updateTrails(dt);
  composer.render();
}
// hook debug : fige la boucle pour permettre une capture d'écran fixe
window.__freeze = () => { cancelAnimationFrame(rafId); return 'frozen'; };
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
animate();
</script>
</body>
</html>
